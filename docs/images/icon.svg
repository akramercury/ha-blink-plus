<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#9333EA"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.25" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iris" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="0.45" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0B1026" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#shine)"/>
  <!-- signal arcs (live) -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" opacity="0.28" stroke-width="18">
    <path d="M78 330 A 182 182 0 0 1 128 150"/>
    <path d="M40 350 A 228 228 0 0 1 96 112" opacity="0.6"/>
  </g>
  <!-- lens -->
  <g filter="url(#soft)">
    <circle cx="250" cy="278" r="150" fill="#FFFFFF"/>
    <circle cx="250" cy="278" r="118" fill="#0F172A"/>
    <circle cx="250" cy="278" r="84" fill="url(#iris)"/>
    <circle cx="250" cy="278" r="34" fill="#0B1026" opacity="0.85"/>
    <circle cx="218" cy="244" r="20" fill="#FFFFFF" opacity="0.92"/>
    <circle cx="282" cy="306" r="8" fill="#FFFFFF" opacity="0.55"/>
  </g>
  <!-- live + badge -->
  <g filter="url(#soft)">
    <circle cx="398" cy="118" r="70" fill="#FFFFFF"/>
    <circle cx="398" cy="118" r="56" fill="#EF4444"/>
    <rect x="390" y="86" width="16" height="64" rx="8" fill="#FFFFFF"/>
    <rect x="366" y="110" width="64" height="16" rx="8" fill="#FFFFFF"/>
  </g>
</svg>
