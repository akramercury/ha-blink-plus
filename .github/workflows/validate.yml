name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Brand images ship inside the integration (custom_components/blink_plus/brand,
          # Home Assistant 2026.3+), not in home-assistant/brands.
          ignore: brands

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  tests:
    name: Offline stream tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Prepare fixtures
        working-directory: tests
        run: |
          ffmpeg -loglevel error -f lavfi -i testsrc=size=640x360:rate=15 -f lavfi -i sine \
            -t 6 -c:v libx264 -g 15 -pix_fmt yuv420p -c:a aac -f mpegts sample.ts
          openssl req -x509 -newkey rsa:2048 -nodes -keyout key.pem -out cert.pem \
            -days 2 -subj /CN=immis.test
      - name: Stream, token fallback, preemption, failure handling
        working-directory: tests
        run: |
          python3 test_immis.py . ../custom_components/blink_plus/immis.py token_ok
          python3 test_immis.py . ../custom_components/blink_plus/immis.py null_only
          python3 test_preempt.py . ../custom_components/blink_plus/immis.py
          python3 test_failure.py . ../custom_components/blink_plus/immis.py
          python3 test_stills.py . ../custom_components/blink_plus/immis.py
      - name: start_live_view hold (warm-up before the player)
        working-directory: tests
        run: |
          python3 test_hold.py . ../custom_components/blink_plus/immis.py \
            ../custom_components/blink_plus/live_hold.py
      - name: Two-way talk
        working-directory: tests
        run: |
          python3 test_talk.py . ../custom_components/blink_plus/immis.py \
            ../custom_components/blink_plus/talk.py
      - name: Clip archive (cloud + USB)
        working-directory: tests
        run: python3 test_archive.py ../custom_components/blink_plus/archive.py
      - name: blinkpy load reductions (patched, gated, safe fallback)
        working-directory: tests
        run: python3 test_blinkpy_patches.py ../custom_components/blink_plus/blinkpy_patches.py

  home-assistant:
    name: Current Home Assistant (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pip picks the newest Home Assistant that supports this Python.
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Home Assistant (+ camera/stream/ffmpeg requirements)
        run: |
          pip install homeassistant "blinkpy>=0.25.5"
          python3 - > ha-requirements.txt <<'PY'
          import json, os, homeassistant.components as comps
          base = os.path.dirname(comps.__file__)
          for comp in ("camera", "stream", "ffmpeg"):
              with open(os.path.join(base, comp, "manifest.json")) as f:
                  print("\n".join(json.load(f).get("requirements", [])))
          PY
          pip install -r ha-requirements.txt
          python3 -c "import homeassistant.const as c; print('Home Assistant', c.__version__)"
      - name: Import every module, call the actions through Home Assistant
        working-directory: tests
        run: |
          ffmpeg -loglevel error -f lavfi -i sine=frequency=300:duration=1 -ac 2 -ar 48000 talk_in.wav
          python3 test_ha_current.py .. .
